name: Bootstrap infra (una sola vez)

# Se dispara solo a mano (botón "Run workflow" en la pestaña Actions de GitHub) - NUNCA
# automático, porque usa credenciales estáticas temporales en vez de OIDC. Es el ÚNICO
# workflow que necesita esas credenciales: crea toda la infraestructura de una vez,
# incluyendo el rol OIDC (aws_iam_role.github_actions_deploy) que los demás workflows
# (deploy-ui.yml, infra-backend.yml) usan de ahí en adelante sin necesitar
# access keys nunca más. Después de correr esto una vez, borra los secrets
# AWS_ACCESS_KEY_ID_BOOTSTRAP / AWS_SECRET_ACCESS_KEY_BOOTSTRAP y el access key temporal
# que los generó.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (temporales, solo para este bootstrap)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_BOOTSTRAP }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_BOOTSTRAP }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - run: terraform apply -auto-approve

      - name: Mostrar outputs
        run: |
          echo "### Outputs de Terraform" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform output >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Siguiente paso**: copia el valor de _github_actions_role_arn_ de arriba" >> "$GITHUB_STEP_SUMMARY"
          echo "y guárdalo como el secret **AWS_ROLE_ARN** en este repo. Luego borra" >> "$GITHUB_STEP_SUMMARY"
          echo "los secrets AWS_ACCESS_KEY_ID_BOOTSTRAP / AWS_SECRET_ACCESS_KEY_BOOTSTRAP" >> "$GITHUB_STEP_SUMMARY"
          echo "y el access key temporal que los generó." >> "$GITHUB_STEP_SUMMARY"
